<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>火场智控 · 请使用 App 扫码登录</title>
  <link rel="stylesheet" href="/admin/css/main.css">
</head>
<body>
  <main class="login-view">
    <section class="login-card scan-guide-card" aria-label="扫码登录引导">
      <div class="login-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>请使用火场智控 App 扫码</h1>
          <span class="brand-badge">安全提示</span>
        </div>
      </div>

      <p class="login-desc">当前二维码为管理后台专属安全凭证，请勿使用系统相机或第三方扫码工具打开。</p>

      <ol class="login-steps">
        <li class="step-item">
          <span class="step-num">1</span>
          <span>在手机上打开「火场智控」App</span>
        </li>
        <li class="step-item">
          <span class="step-num">2</span>
          <span>进入「设置」→ 身份卡右上角「扫一扫」</span>
        </li>
        <li class="step-item">
          <span class="step-num">3</span>
          <span>重新扫描电脑屏幕上的登录二维码并确认</span>
        </li>
      </ol>

      <a href="/admin" class="btn btn-primary btn-block">前往管理控制台</a>
    </section>
  </main>
</body>
</html>
