# WatchDog 安全员助手 —— 8443 HTTPS 反代（不影响现有 proexam/代理服务）
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    server_name bytevirt.meiyou.xyz;

    ssl_certificate /etc/letsencrypt/live/bytevirt.meiyou.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bytevirt.meiyou.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;   # 音频上传（后端限 15MB）

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # ASR 识别耗时长；流式问答（SSE）长连接需更大余量
        proxy_buffering off;       # 流式回答逐段转发，不缓冲
    }

    # 端侧 ASR 模型文件（App 设置页下载，不入库，手动/rsync 同步）
    location /models/ {
        alias /opt/watchdog/models/;
        add_header Cache-Control "public, max-age=31536000";
    }

    location / {
        return 404;
    }
}
