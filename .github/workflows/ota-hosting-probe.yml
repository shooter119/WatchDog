name: OTA hosting probe

on:
  push:
    branches: ['codex/fix-domestic-ota-static-1.2.4-60']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDBASE_OTA_ENV_ID: ${{ secrets.CLOUDBASE_OTA_ENV_ID }}
      CLOUDBASE_OTA_API_KEY: ${{ secrets.CLOUDBASE_OTA_API_KEY }}
      OTA_HOSTING_DOMAIN: watchdog-prod-d6gch930m378d9a16-1351750301.tcloudbaseapp.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Upload and read back a temporary hosting object
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_OTA_ENV_ID"
          test -n "$CLOUDBASE_OTA_API_KEY"
          probe_file="${RUNNER_TEMP}/watchdog-ota-hosting-probe.json"
          probe_path="ota-probes/mapping-${GITHUB_RUN_ID}.json"
          node - "$probe_file" <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.argv[2], `${JSON.stringify({ probe: 'watchdog-ota-hosting' })}\n`);
          NODE
          cloudbase_cli=(npx --yes --package @cloudbase/cli@3.8.1 tcb)
          "${cloudbase_cli[@]}" login \
            --cloudbase-api-key "$CLOUDBASE_OTA_API_KEY" \
            -e "$CLOUDBASE_OTA_ENV_ID"
          "${cloudbase_cli[@]}" hosting deploy \
            "$probe_file" \
            "$probe_path" \
            -e "$CLOUDBASE_OTA_ENV_ID" \
            --concurrency 1 --retry-count 2 --json
          curl --fail --silent --show-error --location \
            --connect-timeout 20 --max-time 60 \
            "https://${OTA_HOSTING_DOMAIN}/${probe_path}" \
            --output "${RUNNER_TEMP}/watchdog-ota-hosting-probe-public.json"
          cmp --silent "$probe_file" "${RUNNER_TEMP}/watchdog-ota-hosting-probe-public.json"
          echo 'CloudBase 静态托管国内公开回读通过'
