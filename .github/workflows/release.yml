# WatchDog 发布流水线：push tag v* → 构建 arm64 正式签名 APK → 发布 GitHub Release
# App 端「检查更新」查 releases/latest，从 release body 读取 versionCode 与 SHA256 后下载安装。
name: Build & Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog 需要完整历史

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true

      # 签名注入：keystore 以 base64 secret 存储，key.properties 由 3 个 secret 拼装
      # （key.properties/keystore 不入库，缺失时 build.gradle.kts 会静默退化为 debug 签名）
      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.WATCHDOG_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WATCHDOG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCHDOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATCHDOG_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/watchdog-release.keystore
          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=watchdog-release.keystore
          EOF
          ls -la app/android/app/watchdog-release.keystore

      - name: Build release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      # 防呆：比对 APK 签名与 keystore 指纹，不一致（静默 debug 签名）则终止发布
      - name: Verify release signature
        working-directory: app
        env:
          STORE_PASSWORD: ${{ secrets.WATCHDOG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCHDOG_KEY_ALIAS }}
        run: |
          APK_SHA=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk 2>/dev/null | grep "SHA256:" | head -1)
          KEY_SHA=$(keytool -list -v -keystore android/app/watchdog-release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | grep "SHA256:" | head -1)
          echo "APK: $APK_SHA"
          echo "KEY: $KEY_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK 签名与发布密钥不一致（可能静默使用了 debug 签名），终止发布"
            exit 1
          fi

      - name: Prepare release assets
        id: release
        working-directory: app
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v0.8.5+22
          VERSION="${TAG#v}"                       # 0.8.5+22
          APK="build/app/outputs/flutter-apk/app-release.apk"
          cp "$APK" "build/app/outputs/flutter-apk/watchdog-${VERSION}-arm64-v8a.apk"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          PREV=$(git -C .. describe --tags --abbrev=0 "${TAG}~1" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git -C .. log --oneline --no-merges "${PREV}..${TAG}")
          else
            CHANGELOG="首个自动发布版本"
          fi
          {
            echo "## ${TAG}"
            echo ""
            echo "versionCode: ${VERSION##*+}"
            echo "SHA256: ${SHA256}"
            echo ""
            echo "### 更新内容"
            echo "${CHANGELOG}"
          } > release-body.md
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cat release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.version }}
          body_path: app/release-body.md
          files: |
            app/build/app/outputs/flutter-apk/watchdog-*-arm64-v8a.apk
          fail_on_unmatched_files: true
