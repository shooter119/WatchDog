# WatchDog 发布流水线：push tag v* → 构建 arm64 正式签名 APK → 发布 GitHub Release
# 并将同一 APK 发布到 CloudBase 静态托管 CDN；App 端只访问国内 latest.json。
name: Build & Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# 同一时间只允许一个版本推进 Release 与国内 OTA；脚本还会校验 versionCode
# 单调递增，防止排队中的旧 tag 覆盖 latest.json。
concurrency:
  group: watchdog-release-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # changelog 需要完整历史
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.38.5
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_ARCHIVE="${RUNNER_TEMP}/flutter_linux_3.38.5-stable.tar.xz"
          FLUTTER_ROOT="${RUNNER_TEMP}/watchdog-flutter"
          FLUTTER_URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.5-stable.tar.xz"
          FLUTTER_SHA256="a264940cfc431c1778f34f7413fa6ab71443ad52c71f38c50b0284397a4039b0"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "$FLUTTER_URL" --output "$FLUTTER_ARCHIVE"
          echo "$FLUTTER_SHA256  $FLUTTER_ARCHIVE" | sha256sum --check --status
          test ! -e "$FLUTTER_ROOT"
          tar -xJf "$FLUTTER_ARCHIVE" -C "$RUNNER_TEMP"
          mv "${RUNNER_TEMP}/flutter" "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          echo "$FLUTTER_ROOT/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" --version

      # tag 发布必须先通过与合并相同的质量门禁，不能绕过失败的回归测试。
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Release automation tests
        run: node --test .github/scripts/*.test.cjs
      - name: Backend quality gate and runtime count gate
        working-directory: backend
        env:
          # 通过 npm test 运行时摘要校验；新增测试后只允许提高此基线。
          MIN_BACKEND_TESTS: '162'
        shell: bash
        run: |
          npm ci
          qa_report="$(mktemp)"
          set -o pipefail
          set +e
          npm test 2>&1 | tee "$qa_report"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          npm_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          if [ "$npm_status" -ne 0 ]; then
            exit "$npm_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            exit "$tee_status"
          fi

          actual_tests="$(awk '$1 == "ℹ" && $2 == "tests" { count = $3 } END { print count }' "$qa_report")"
          actual_skipped="$(awk '$1 == "ℹ" && $2 == "skipped" { count = $3 } END { print count }' "$qa_report")"
          actual_todo="$(awk '$1 == "ℹ" && $2 == "todo" { count = $3 } END { print count }' "$qa_report")"
          case "$actual_tests" in
            ''|*[!0-9]*)
              echo '::error::无法从 npm test 运行时摘要读取后端测试数量'
              exit 1
              ;;
          esac
          case "$actual_skipped" in
            ''|*[!0-9]*)
              echo '::error::无法从 npm test 运行时摘要读取 skipped 数量'
              exit 1
              ;;
          esac
          case "$actual_todo" in
            ''|*[!0-9]*)
              echo '::error::无法从 npm test 运行时摘要读取 skipped/todo 数量'
              exit 1
              ;;
          esac
          if [ "$actual_skipped" -ne 0 ] || [ "$actual_todo" -ne 0 ]; then
            echo "::error::后端测试存在 skipped=$actual_skipped 或 todo=$actual_todo"
            exit 1
          fi
          if [ "$actual_tests" -lt "$MIN_BACKEND_TESTS" ]; then
            echo "::error::后端运行时测试数量 $actual_tests 少于基线 $MIN_BACKEND_TESTS"
            exit 1
          fi
          echo "后端运行时测试数量：$actual_tests（基线：$MIN_BACKEND_TESTS）"
      - name: Flutter quality gate and runtime count gate
        working-directory: app
        env:
          # Flutter JSON reporter 的可见 testDone 事件是运行时计数；新增测试后只允许提高此基线。
          MIN_APP_TESTS: '223'
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          qa_report="$(mktemp)"
          set -o pipefail
          set +e
          flutter test --reporter json 2>&1 | tee "$qa_report"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          flutter_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          if [ "$flutter_status" -ne 0 ]; then
            exit "$flutter_status"
          fi
          if [ "$tee_status" -ne 0 ]; then
            exit "$tee_status"
          fi

          actual_tests="$(python3 - "$qa_report" <<'PY'
          import json
          import sys

          count = 0
          skipped = 0
          done_event = False
          with open(sys.argv[1], encoding='utf-8') as stream:
              for line in stream:
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get('type') == 'testDone' and not event.get('hidden', False):
                      count += 1
                      if event.get('skipped', False):
                          skipped += 1
                  if event.get('type') == 'done':
                      done_event = True
                      if not event.get('success', False):
                          print('Flutter JSON reporter reported an unsuccessful run', file=sys.stderr)
                          sys.exit(1)

          if not done_event:
              print('Flutter JSON reporter did not emit a done event', file=sys.stderr)
              sys.exit(1)
          if skipped:
              print(f'Flutter JSON reporter reported {skipped} skipped test(s)', file=sys.stderr)
              sys.exit(1)
          print(count)
          PY
          )" || {
            echo '::error::无法解析 Flutter JSON reporter 的运行时测试数量'
            exit 1
          }
          case "$actual_tests" in
            ''|*[!0-9]*)
              echo '::error::Flutter JSON reporter 未提供有效的运行时测试数量'
              exit 1
              ;;
          esac
          if [ "$actual_tests" -lt "$MIN_APP_TESTS" ]; then
            echo "::error::App 运行时测试数量 $actual_tests 少于基线 $MIN_APP_TESTS"
            exit 1
          fi
          echo "App 运行时测试数量：$actual_tests（基线：$MIN_APP_TESTS）"

      - name: Verify release version metadata
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUB_VERSION=$(sed -n "s/^version: *//p" app/pubspec.yaml | head -1)
          APP_VERSION=$(sed -n "s/^const appVersion = '\([^']*\)';/\1/p" app/lib/pages/settings_page.dart | head -1)
          test -n "$TAG_VERSION"
          test "$TAG_VERSION" = "$PUB_VERSION"
          test "$PUB_VERSION" = "$APP_VERSION"
          echo "发布版本一致：$TAG_VERSION"

      # 签名注入：keystore 以 base64 secret 存储，key.properties 由 3 个 secret 拼装
      # （key.properties/keystore 不入库；缺失时前置检查直接失败）
      - name: Setup signing
        env:
          KEYSTORE_B64: ${{ secrets.WATCHDOG_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WATCHDOG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCHDOG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WATCHDOG_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 -d > app/android/app/watchdog-release.keystore
          cat > app/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=watchdog-release.keystore
          EOF
          ls -la app/android/app/watchdog-release.keystore

      # 静态托管凭据缺失时尽早失败，避免先构建大包再在发布末尾才发现
      # 无法完成国内 OTA。
      - name: Validate OTA configuration
        env:
          CLOUDBASE_OTA_ENV_ID: ${{ secrets.CLOUDBASE_OTA_ENV_ID }}
          CLOUDBASE_OTA_API_KEY: ${{ secrets.CLOUDBASE_OTA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_OTA_ENV_ID"
          test -n "$CLOUDBASE_OTA_API_KEY"
          [[ "$CLOUDBASE_OTA_ENV_ID" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,62}$ ]]
          echo '国内 OTA 配置格式检查通过'

      - name: Build release APK
        working-directory: app
        env:
          CLOUDBASE_OTA_ENV_ID: ${{ secrets.CLOUDBASE_OTA_ENV_ID }}
        run: |
          set -euo pipefail
          flutter pub get
          OTA_HOSTING_DOMAIN="watchdog-prod-d6gch930m378d9a16-1351750301.tcloudbaseapp.com"
          OTA_MANIFEST_URL="https://${OTA_HOSTING_DOMAIN}/ota/latest.json"
          # 只发布 arm64 split APK；Prepare release assets 从包内读取最终
          # versionCode，确保 Flutter 的 ABI 偏移与 OTA 清单保持一致。
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            "--dart-define=WATCHDOG_UPDATE_MANIFEST_URL=${OTA_MANIFEST_URL}"
          ls -lh build/app/outputs/flutter-apk/

      # 文件名标记为 arm64 前先确认包内没有误带其他 ABI，避免发布体积和兼容性
      # 与分发说明不一致。
      - name: Verify APK ABI
        working-directory: app
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::APK 包含非 arm64 ABI"
            exit 1
          fi

      # 防呆：比对 APK 签名与 keystore 指纹，不一致（静默 debug 签名）则终止发布
      # AGP9 默认 minSdk>=24 关闭 v1(JAR) 签名，keytool -printcert -jarfile 读不到证书，
      # 必须用 apksigner verify --print-certs（读 v2/v3 签名块）
      - name: Verify release signature
        working-directory: app
        env:
          STORE_PASSWORD: ${{ secrets.WATCHDOG_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WATCHDOG_KEY_ALIAS }}
        run: |
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          APK_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr 'a-f' 'A-F' | tr -d ':')
          KEY_SHA=$(keytool -list -v -keystore android/app/watchdog-release.keystore -alias "$KEY_ALIAS" -storepass "$STORE_PASSWORD" 2>/dev/null | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ':')
          echo "APK SHA-256: $APK_SHA"
          echo "KEY SHA-256: $KEY_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$KEY_SHA" ]; then
            echo "::error::APK 签名与发布密钥不一致（可能静默使用了 debug 签名），终止发布"
            exit 1
          fi

      - name: Prepare release assets
        id: release
        working-directory: app
        run: |
          TAG="${GITHUB_REF#refs/tags/}"          # v0.8.5+22
          VERSION="${TAG#v}"                       # 0.8.5+22
          VERSION_NAME="${VERSION%%+*}"             # 0.8.5
          TAG_BUILD_NUMBER="${VERSION##*+}"
          if ! [[ "$TAG_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::tag 必须包含正整数构建号（如 v1.2.3+50）"
            exit 1
          fi
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 2>/dev/null | sort -V | tail -1)
          test -n "$AAPT2"
          APK_METADATA=$("$AAPT2" dump badging "$APK" | sed -n '1p')
          APK_VERSION=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$APK_METADATA")
          VERSION_CODE=$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<<"$APK_METADATA")
          test "$APK_VERSION" = "$VERSION_NAME"
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::无法从 arm64 APK 读取有效 Android versionCode"
            exit 1
          fi
          EXPECTED_VERSION_CODE=$((2000 + TAG_BUILD_NUMBER))
          if [ "$VERSION_CODE" -ne "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::arm64 APK versionCode 与 tag 的 Flutter ABI 偏移不一致"
            exit 1
          fi
          echo "APK versionName/versionCode：$APK_VERSION/$VERSION_CODE（tag build number：$TAG_BUILD_NUMBER）"
          cp "$APK" "build/app/outputs/flutter-apk/watchdog-${VERSION}-arm64-v8a.apk"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          PREV=$(git -C .. describe --tags --abbrev=0 "${TAG}~1" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git -C .. log --oneline --no-merges "${PREV}..${TAG}")
          else
            CHANGELOG="首个自动发布版本"
          fi
          {
            echo "## ${TAG}"
            echo ""
            echo "versionCode: ${VERSION_CODE}"
            echo "SHA256: ${SHA256}"
            echo ""
            echo "### 更新内容"
            echo "${CHANGELOG}"
          } > release-body.md
          printf '%s\n' "${CHANGELOG}" > ota-changelog.txt
          SIZE_BYTES=$(wc -c < "$APK" | tr -d ' ')
          echo "apk_file=build/app/outputs/flutter-apk/watchdog-${VERSION}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "apk_path=releases/${TAG}/watchdog-${VERSION}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "size_bytes=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          cat release-body.md

      # 先完成国内 OTA 上传并校验，再创建 GitHub Release；这样 OTA 配置缺失或
      # 上传校验失败时不会留下已创建但不可用的半成品 Release。
      # 国内 OTA：上传与 GitHub Release 完全相同的 APK，最后才更新 latest.json。
      # CloudBase 静态托管由 COS + CDN 提供国内 HTTPS 分发，避开 PG Storage
      # API 网关对大 APK 的 300 秒上游连接超时。当前 arm64 APK 必须小于官方
      # 静态托管单文件 50 MB 限制；远端回读仍是发布成功的硬门禁。
      - name: Publish domestic OTA
        working-directory: app
        env:
          CLOUDBASE_OTA_ENV_ID: ${{ secrets.CLOUDBASE_OTA_ENV_ID }}
          CLOUDBASE_OTA_API_KEY: ${{ secrets.CLOUDBASE_OTA_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
          APK_FILE: ${{ steps.release.outputs.apk_file }}
          APK_PATH: ${{ steps.release.outputs.apk_path }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.release.outputs.size_bytes }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDBASE_OTA_ENV_ID"
          test -n "$CLOUDBASE_OTA_API_KEY"
          test -f "$APK_FILE"
          test "$(sha256sum "$APK_FILE" | awk '{print $1}')" = "$SHA256"
          test "$(wc -c < "$APK_FILE" | tr -d ' ')" = "$SIZE_BYTES"
          OTA_HOSTING_DOMAIN="watchdog-prod-d6gch930m378d9a16-1351750301.tcloudbaseapp.com"
          OTA_PUBLIC_BASE_URL="https://${OTA_HOSTING_DOMAIN}/ota"
          if [ "$SIZE_BYTES" -ge 50000000 ]; then
            echo "::error::APK 超过 CloudBase 静态托管单文件 50 MB 限制：$SIZE_BYTES bytes"
            exit 1
          fi

          verify_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/watchdog-ota-verify.XXXXXX")"
          trap 'rm -rf "$verify_dir"' EXIT
          existing_latest_status="$(curl --silent --show-error --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            -o "$verify_dir/existing-latest.json" -w '%{http_code}' \
            "$OTA_PUBLIC_BASE_URL/latest.json" || true)"
          case "$existing_latest_status" in
            200)
              node - "$verify_dir/existing-latest.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const current = Number(process.env.VERSION_CODE);
          const previous = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Number.isSafeInteger(current) || current < 1 ||
              !Number.isSafeInteger(previous.versionCode) || previous.versionCode < 1) {
            throw new Error('OTA versionCode 无效');
          }
          if (current <= previous.versionCode) {
            throw new Error(`OTA versionCode 必须递增：当前 ${current} <= 已发布 ${previous.versionCode}`);
          }
          NODE
              ;;
            404)
              echo '国内 OTA 尚无历史清单，允许首次发布'
              ;;
            *)
              echo "::error::无法安全读取现有国内 OTA 清单（HTTP $existing_latest_status）"
              exit 1
              ;;
          esac

          upload_object() {
            local local_path="$1"
            local object_path="$2"
            local content_type="$3"
            local cache_control="$4"
            local hosting_path="ota/$object_path"
            # 静态托管 CLI 直接将文件上传到 COS/CDN；不用 --location 携带
            # 任何管理凭证，也不把 API Key 写入参数或产物。
            "${cloudbase_cli[@]}" hosting deploy "$local_path" "$hosting_path" \
              -e "$CLOUDBASE_OTA_ENV_ID" \
              --concurrency 1 --retry-count 3 --json >/dev/null
          }

          cloudbase_cli=(npx --yes --package @cloudbase/cli@3.8.1 tcb)
          "${cloudbase_cli[@]}" login \
            --cloudbase-api-key "$CLOUDBASE_OTA_API_KEY" \
            -e "$CLOUDBASE_OTA_ENV_ID"

          # 先生成与 latest.json 字节完全一致的版本化清单。它既是小对象生产
          # 探针，也是每个版本不可变的发布元数据；探针公开回读失败时不传 APK。
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = {
            schemaVersion: 1,
            tagName: process.env.TAG_NAME,
            versionCode: Number(process.env.VERSION_CODE),
            apkPath: process.env.APK_PATH,
            sizeBytes: Number(process.env.SIZE_BYTES),
            sha256: process.env.SHA256.toLowerCase(),
            changelog: fs.readFileSync('ota-changelog.txt', 'utf8').trim(),
          };
          if (!Number.isInteger(manifest.versionCode) || manifest.versionCode < 1) {
            throw new Error('invalid versionCode');
          }
          if (!Number.isInteger(manifest.sizeBytes) || manifest.sizeBytes < 1) {
            throw new Error('invalid sizeBytes');
          }
          if (!/^[0-9a-f]{64}$/.test(manifest.sha256)) {
            throw new Error('invalid sha256');
          }
          fs.writeFileSync('latest.json', `${JSON.stringify(manifest)}\n`);
          NODE

          VERSION_MANIFEST_PATH="${APK_PATH%/*}/manifest.json"
          upload_object \
            latest.json \
            "$VERSION_MANIFEST_PATH" \
            'application/json; charset=utf-8' \
            'public,max-age=31536000,immutable'
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            "$OTA_PUBLIC_BASE_URL/$VERSION_MANIFEST_PATH" \
            -o "$verify_dir/version-manifest.json"
          cmp --silent latest.json "$verify_dir/version-manifest.json"

          upload_object \
            "$APK_FILE" \
            "$APK_PATH" \
            'application/vnd.android.package-archive' \
            'public,max-age=31536000,immutable'

          public_apk_url="$OTA_PUBLIC_BASE_URL/$APK_PATH"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 900 \
            "$public_apk_url" -o "$verify_dir/remote.apk"
          test "$(sha256sum "$verify_dir/remote.apk" | awk '{print $1}')" = "$SHA256"
          test "$(wc -c < "$verify_dir/remote.apk" | tr -d ' ')" = "$SIZE_BYTES"

          upload_object \
            latest.json \
            latest.json \
            'application/json; charset=utf-8' \
            'no-cache,max-age=0,must-revalidate'

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --connect-timeout 20 --max-time 60 \
            -H 'Cache-Control: no-cache' \
            "$OTA_PUBLIC_BASE_URL/latest.json" -o "$verify_dir/latest.json"
          cmp --silent latest.json "$verify_dir/latest.json"
          node - "$verify_dir/latest.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          for (const key of [
            'schemaVersion',
            'tagName',
            'versionCode',
            'apkPath',
            'sizeBytes',
            'sha256',
            'changelog',
          ]) {
            if (!(key in manifest)) throw new Error(`manifest missing ${key}`);
          }
          if (manifest.schemaVersion !== 1 || manifest.tagName !== process.env.TAG_NAME) {
            throw new Error('manifest metadata mismatch');
          }
          if (manifest.versionCode !== Number(process.env.VERSION_CODE) ||
              manifest.apkPath !== process.env.APK_PATH ||
              manifest.sizeBytes !== Number(process.env.SIZE_BYTES) ||
              manifest.sha256 !== process.env.SHA256.toLowerCase() ||
              typeof manifest.changelog !== 'string') {
            throw new Error('manifest release values mismatch');
          }
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release.outputs.version }}
          body_path: app/release-body.md
          files: |
            app/build/app/outputs/flutter-apk/watchdog-*-arm64-v8a.apk
          fail_on_unmatched_files: true
