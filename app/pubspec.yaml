name: watchdog
description: 消防救援现场安全管控 - 语音录入与气瓶倒计时
publish_to: "none"
version: 1.2.1+49

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  record: ^6.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  http: ^1.2.2
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  audioplayers: ^6.1.0
  flutter_local_notifications: ^19.2.0
  timezone: ^0.10.0
  crypto: ^3.0.3
  convert: ^3.1.2
  sherpa_onnx: ^1.13.4
  flutter_markdown: ^0.7.7+1
  flutter_foreground_task: ^10.0.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/branding/fire-control-mark.svg
    - assets/avatars/water-element-avatar-selected.png

dependency_overrides:
  package_info_plus:
    path: third_party/package_info_plus
