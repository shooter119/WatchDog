name: watchdog
description: 消防救援现场安全管控 - 语音录入与气瓶倒计时
publish_to: "none"
version: 0.5.0+12

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  record: ^6.1.2
  path_provider: ^2.1.5
  http: ^1.2.2
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.3
  audioplayers: ^6.1.0
  flutter_local_notifications: ^19.2.0
  timezone: ^0.10.0
  crypto: ^3.0.3
  sherpa_onnx: ^1.13.4
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
